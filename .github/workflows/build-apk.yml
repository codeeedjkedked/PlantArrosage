name: Construire l'APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (ex. v1.0.0). Laisser vide pour ne construire que l'APK."
        required: false
        default: ""

jobs:
  build:
    name: Tests et APK de debug
    runs-on: ubuntu-latest

    # Nécessaire pour que `gh release create` puisse écrire sur le dépôt.
    permissions:
      contents: write

    env:
      # Les noms de tests sont en français : le compilateur Kotlin en dérive des noms de fichiers
      # .class accentués, ce qui exige une locale UTF-8.
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer le JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platform-tools'

      - name: Configurer Gradle
        uses: gradle/actions/setup-gradle@v4

      # Le module :core est du JVM pur : il se teste sans SDK Android et concentre toute la
      # logique métier. On le passe en premier pour échouer vite si la régression est là.
      - name: Tester le module :core
        run: ./gradlew -PskipAndroid=true :core:test

      - name: Construire l'APK de debug
        run: ./gradlew :app:assembleDebug --stacktrace

      # Nom explicite : l'APK sorti de Gradle s'appelle app-debug.apk, ce qui ne dit rien une
      # fois téléchargé à côté d'autres fichiers.
      - name: Renommer l'APK
        id: apk
        env:
          VERSION_DEMANDEE: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_DEMANDEE" ]; then
            tag="$VERSION_DEMANDEE"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag=""
          fi

          version="${tag#v}"
          [ -n "$version" ] || version="${GITHUB_SHA::7}"

          nom="PlantArrosage-${version}-debug.apk"
          mv app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/${nom}"
          echo "chemin=app/build/outputs/apk/debug/${nom}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Publier l'APK en artefact
        uses: actions/upload-artifact@v4
        with:
          name: PlantArrosage-debug-apk
          path: ${{ steps.apk.outputs.chemin }}
          if-no-files-found: error

      # Crée une release publique : lien de téléchargement direct et permanent, contrairement à
      # un artefact qui expire au bout de 90 jours.
      # `gh release create` pose le tag lui-même s'il n'existe pas encore, ce qui permet de
      # publier depuis un déclenchement manuel sans avoir à pousser un tag.
      - name: Publier la release
        if: steps.apk.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.apk.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "PlantArrosage $TAG" \
            --notes "APK de debug, signé avec la clé de debug Android : installable directement après avoir autorisé les sources inconnues.

          **Aucune clé API n'est incluse.** Au premier lancement, ouvrez Réglages et collez :
          - une clé Pl@ntNet — https://my.plantnet.org/ (gratuite, ~500 identifications/jour)
          - une clé Perenual — https://perenual.com/docs/api (gratuite, 100 requêtes/jour)

          Identification fournie par Pl@ntNet, données d'entretien par Perenual." \
            "${{ steps.apk.outputs.chemin }}"

      - name: Publier les rapports de test en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: |
            core/build/reports/tests/
            app/build/reports/
          if-no-files-found: ignore
