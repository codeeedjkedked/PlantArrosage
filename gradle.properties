org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx1536m -Dfile.encoding=UTF-8

# Les noms de tests sont écrits en français avec accents. Le compilateur Kotlin en dérive des noms
# de fichiers .class, ce qui exige une locale système UTF-8 : sur une machine en locale POSIX/C,
# le build échoue sur « InvalidPathException: Malformed input ». Voir le README.

# Propriétés lues uniquement par le module :app (ignorées quand -PskipAndroid=true)
android.useAndroidX=true
android.nonTransitiveRClass=true
